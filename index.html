<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青苗琴行 - 雲端相片列印系統</title>
    <meta name="theme-color" content="#1a1a1a">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212; /* 極致黑 */
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; margin: 0; color: #fff;
            padding-bottom: 160px;
            user-select: none;
        }
        
        /* 標題帶有科技感光暈 */
        h2 { 
            color: #fff; margin: 15px 0 25px 0; font-size: 1.2rem; 
            text-align: center; font-weight: 300; letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        /* 切換區 - 深灰風格 */
        .toggle-container {
            display: flex; background: #2c2c2c; border-radius: 50px; padding: 4px;
            margin-bottom: 20px; width: 100%; max-width: 320px;
            border: 1px solid #333;
        }
        .toggle-btn {
            flex: 1; padding: 12px; border-radius: 40px; border: none; background: transparent;
            font-weight: bold; color: #888; cursor: pointer; transition: 0.3s;
        }
        .toggle-btn.active { background: #444; color: #4caf50; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

        /* 功能按鈕 - 簡約線條 */
        .top-actions { display: flex; gap: 15px; width: 100%; max-width: 350px; margin-bottom: 25px; }
        .action-btn {
            flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #444;
            font-weight: 500; font-size: 0.9rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: #1e1e1e; color: #ccc; transition: 0.2s;
        }
        .action-btn:active { background: #333; border-color: #4caf50; }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* 畫布 - 模擬螢幕發光 */
        .canvas-wrapper {
            position: relative; margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid #333; background: #222;
            display: flex; justify-content: center; align-items: center;
            border-radius: 8px; overflow: hidden; touch-action: pan-y; 
        }
        canvas {
            max-width: 85vw; max-height: 50vh;
            width: auto !important; height: auto !important;
            background: #fff; 
        }

        /* 底部操作區 */
        .fixed-footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #1a1a1a; padding: 20px 20px 40px 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.7);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            z-index: 99; border-top: 1px solid #333;
        }
        
        .zoom-container { width: 100%; max-width: 350px; display: flex; align-items: center; gap: 15px; padding: 0 10px; }
        .zoom-icon { font-size: 1rem; color: #666; }
        input[type=range] { flex: 1; accent-color: #4caf50; height: 4px; cursor: pointer; background: #333; }

        /* 主按鈕 - 科技綠漸層 */
        .btn-submit {
            background: linear-gradient(90deg, #2e7d32 0%, #4caf50 100%);
            color: white; border: none;
            padding: 16px 30px; border-radius: 50px; font-size: 1.1rem; font-weight: bold;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4); cursor: pointer;
            width: 100%; max-width: 400px; display: flex; align-items: center; justify-content: center; gap: 10px;
            letter-spacing: 1px; transition: transform 0.1s;
        }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }

        /* ================= 系統模擬元素 ================= */
        
        /* 全螢幕遮罩 (系統處理中) */
        .system-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 3000;
            flex-direction: column; justify-content: center; align-items: center;
            color: #4caf50; font-family: monospace;
        }
        
        /* 進度條 */
        .progress-container {
            width: 80%; max-width: 300px; height: 4px; background: #333;
            border-radius: 2px; margin: 20px 0; overflow: hidden;
        }
        .progress-bar {
            height: 100%; width: 0%; background: #4caf50;
            transition: width 0.2s; box-shadow: 0 0 10px #4caf50;
        }
        
        .log-text { font-size: 0.9rem; color: #aaa; margin-top: 10px; min-height: 1.2em; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* 相框 Modal - 深色版 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-box {
            background: #222; border: 1px solid #444; padding: 20px; border-radius: 16px; 
            width: 100%; max-width: 360px; max-height: 80vh; overflow-y: auto; text-align: center; color: #fff;
        }
        .frame-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .frame-opt img { width: 100%; border: 2px solid #444; border-radius: 5px; }

        /* 儲存提示 Modal */
        .save-hint-img { 
            width: 60%; border: 2px solid #4caf50; border-radius: 8px;
            margin: 15px 0; display: block; box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
            touch-action: none; -webkit-user-select: none;
        }
        
        #fileInput { display: none; }
    </style>
</head>
<body>

    <h2>青苗琴行 - 雲端相片列印系統</h2>

    <div class="toggle-container">
        <button class="toggle-btn active" id="btn-v" onclick="setOrientation('V')">直向</button>
        <button class="toggle-btn" id="btn-h" onclick="setOrientation('H')">橫向</button>
    </div>

    <div class="top-actions">
        <button class="action-btn" onclick="document.getElementById('fileInput').click()">
            <span>📷</span> 載入照片
        </button>
        <button id="btnOpenFrame" class="action-btn" onclick="openFrameModal()" disabled>
            <span>🖼️</span> 套用相框
        </button>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper" onclick="handleCanvasClick()">
        <canvas id="mainCanvas"></canvas>
    </div>

    <input type="file" id="fileInput" accept="image/*">

    <div class="fixed-footer">
        <div class="zoom-container">
            <span class="zoom-icon">➖</span>
            <input type="range" id="zoomSlider" min="1" max="3" step="0.05" value="1" disabled>
            <span class="zoom-icon">➕</span>
        </div>

        <button class="btn-submit" onclick="simulateSystemUpload()">
            <span>🖨️</span> 上傳至列印隊列
        </button>
    </div>

    <div id="systemOverlay" class="system-overlay">
        <div style="font-size: 3rem; margin-bottom: 20px;">☁️</div>
        <div style="font-size: 1.2rem; font-weight: bold; color: #fff;">正在處理影像...</div>
        
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        
        <div id="logText" class="log-text">Initializing...</div>
    </div>

    <div id="saveModal" class="modal-overlay" style="z-index: 2500;">
        <div class="modal-box" style="display:flex; flex-direction:column; align-items:center;">
            <h3 style="color:#4caf50; margin: 0 0 10px 0;">✅ 影像處理完成</h3>
            
            <p style="font-size:0.9rem; color:#aaa; margin:5px 0;">為了驗證您的列印權限，請執行以下步驟：</p>

            <div style="background:#333; padding:10px; border-radius:8px; width:100%; text-align:left; margin-top:10px; font-size:0.85rem; line-height:1.6;">
                <span style="color:#4caf50; font-weight:bold;">步驟 1：</span>長按下方圖片，選擇「儲存到相片」。<br>
                <span style="color:#4caf50; font-weight:bold;">步驟 2：</span>按下按鈕，在 WhatsApp 貼上圖片。
            </div>

            <img id="finalImg" class="save-hint-img" src="">

            <button class="btn-submit" onclick="redirectToWhatsapp()" style="width:100%; padding:12px; margin-top:5px; background: #25D366;">
                開啟 WhatsApp 傳送 ➤
            </button>
            
            <button style="margin-top:15px; background:none; border:none; text-decoration:underline; color:#666;" onclick="closeModal('saveModal')">取消</button>
        </div>
    </div>

    <div id="frameModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="frameTitle" style="margin-top:0;">選擇相框</h3>
            <div id="frameList" class="frame-grid"></div>
            <button style="margin-top:15px; padding:10px; width:100%; border:none; background:#444; color:#fff; border-radius:8px;" onclick="closeModal('frameModal')">返回</button>
        </div>
    </div>

    <script>
        // ================= 設定區 =================
        const TARGET_PHONE = "85212345678"; 
        // =========================================

        const SUPER_DPI = 1200; 
        const INCH_TO_MM = 25.4;
        const R2_W_MM = 63.5;
        const R2_H_MM = 88.9;
        const W_PX = Math.round(R2_W_MM / INCH_TO_MM * SUPER_DPI);
        const H_PX = Math.round(R2_H_MM / INCH_TO_MM * SUPER_DPI);

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const zoomSlider = document.getElementById('zoomSlider');

        let orientation = 'V'; 
        let uploadedImg = new Image();
        let isLoaded = false;
        let frameImg = null;
        let imgState = { x: 0, y: 0, baseScale: 1, zoom: 1 };
        
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let initialPinchDist = 0;
        let initialZoom = 1;

        const FRAME_LIBRARY = {
            V: [ 
                { name: "無邊框", url: null },
                { name: "直向 A", url: "https://cdn.prod.website-files.com/68706ab53a6b0f51d8f998af/694398382a80b3f334b17196_2b5e59a2e52edeb1b5fec9a142439443_Frame1-2RV-01-01.png" },
                { name: "直向 B", url: "https://cdn.prod.website-files.com/68706ab53a6b0f51d8f998af/6943a48f2a69aca3aa5db67b_Frame1-3RV-01.png" }
            ],
            H: [ 
                { name: "無邊框", url: null },
                { name: "橫向 A", url: "https://cdn.prod.website-files.com/68706ab53a6b0f51d8f998af/694398388d4a3cf9e3e11cc2_a7600849fa09e3efea43694f11422d95_Frame1-2RH-01.png" },
                { name: "橫向 B", url: "https://cdn.prod.website-files.com/68706ab53a6b0f51d8f998af/6943a48f299debb02cfb3b00_Frame2-2RH.png" }
            ]
        };

        function initCanvas() {
            if (orientation === 'V') { canvas.width = W_PX; canvas.height = H_PX; } 
            else { canvas.width = H_PX; canvas.height = W_PX; }
            draw();
        }

        function setOrientation(type) {
            if (orientation === type && !isLoaded) return;
            orientation = type;
            document.getElementById('btn-v').className = type === 'V' ? 'toggle-btn active' : 'toggle-btn';
            document.getElementById('btn-h').className = type === 'H' ? 'toggle-btn active' : 'toggle-btn';
            
            uploadedImg = new Image();
            isLoaded = false;
            frameImg = null;
            imgState = { x: 0, y: 0, baseScale: 1, zoom: 1 };
            
            canvasWrapper.style.touchAction = "auto"; 
            document.getElementById('fileInput').value = ""; 
            document.getElementById('btnOpenFrame').disabled = true; 
            zoomSlider.disabled = true; 
            zoomSlider.value = 1;
            
            initCanvas();
        }

        function handleCanvasClick() {
            if (!isLoaded) { document.getElementById('fileInput').click(); }
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    uploadedImg.src = evt.target.result;
                    uploadedImg.onload = function() { 
                        isLoaded = true; 
                        canvasWrapper.style.touchAction = "none";
                        document.getElementById('btnOpenFrame').disabled = false;
                        zoomSlider.disabled = false;
                        fitImage(); 
                        initCanvas(); 
                    }
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        function fitImage() {
            const cW = canvas.width;
            const cH = canvas.height;
            const scaleX = cW / uploadedImg.width;
            const scaleY = cH / uploadedImg.height;
            imgState.baseScale = Math.max(scaleX, scaleY);
            imgState.zoom = 1;
            zoomSlider.value = 1;
            centerImage();
        }

        function centerImage() {
            const cW = canvas.width;
            const cH = canvas.height;
            const currentW = uploadedImg.width * imgState.baseScale * imgState.zoom;
            const currentH = uploadedImg.height * imgState.baseScale * imgState.zoom;
            imgState.x = (cW - currentW) / 2;
            imgState.y = (cH - currentH) / 2;
            clampPosition();
        }

        function clampPosition() {
            const cW = canvas.width;
            const cH = canvas.height;
            const currentW = uploadedImg.width * imgState.baseScale * imgState.zoom;
            const currentH = uploadedImg.height * imgState.baseScale * imgState.zoom;
            const minX = cW - currentW;
            const minY = cH - currentH;
            if (imgState.x > 0) imgState.x = 0;
            if (imgState.y > 0) imgState.y = 0;
            if (imgState.x < minX) imgState.x = minX;
            if (imgState.y < minY) imgState.y = minY;
        }

        function draw() {
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (isLoaded) {
                const finalW = uploadedImg.width * imgState.baseScale * imgState.zoom;
                const finalH = uploadedImg.height * imgState.baseScale * imgState.zoom;
                ctx.drawImage(uploadedImg, imgState.x, imgState.y, finalW, finalH);
            } else {
                ctx.fillStyle = '#111'; ctx.fillRect(0,0,canvas.width, canvas.height);
                ctx.fillStyle = '#333'; ctx.font = 'bold 150px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('+', canvas.width/2, canvas.height/2);
            }
            if (frameImg) { ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height); }
        }

        function getDist(t1, t2) { return Math.sqrt(Math.pow(t1.clientX - t2.clientX, 2) + Math.pow(t1.clientY - t2.clientY, 2)); }
        function getPos(e) { const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; let cx, cy; if(e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; } else { cx = e.clientX; cy = e.clientY; } return { x: (cx - rect.left) * scaleX, clientX: cx, clientY: cy }; }
        canvas.addEventListener('mousedown', e => { if(!isLoaded) return; isDragging=true; const p=getPos(e); dragStart={x:p.clientX, y:p.clientY, originX:imgState.x, originY:imgState.y}; });
        window.addEventListener('mousemove', e => { if(!isDragging) return; e.preventDefault(); const rect=canvas.getBoundingClientRect(); const scaleC=canvas.width/rect.width; const dx=(e.clientX-dragStart.x)*scaleC; const dy=(e.clientY-dragStart.y)*scaleC; imgState.x=dragStart.originX+dx; imgState.y=dragStart.originY+dy; clampPosition(); draw(); });
        window.addEventListener('mouseup', () => isDragging=false);
        canvas.addEventListener('touchstart', e => { if(!isLoaded) return; if (e.touches.length === 2) { isDragging = false; initialPinchDist = getDist(e.touches[0], e.touches[1]); initialZoom = imgState.zoom; } else if (e.touches.length === 1) { isDragging = true; const p = getPos(e); dragStart = {x:p.clientX, y:p.clientY, originX:imgState.x, originY:imgState.y}; } }, {passive: false});
        canvas.addEventListener('touchmove', e => { if(!isLoaded) return; e.preventDefault(); if (e.touches.length === 2 && initialPinchDist > 0) { const currentDist = getDist(e.touches[0], e.touches[1]); const scale = currentDist / initialPinchDist; updateZoom(initialZoom * scale); } else if (isDragging && e.touches.length === 1) { const rect = canvas.getBoundingClientRect(); const scaleC = canvas.width / rect.width; const dx = (e.touches[0].clientX - dragStart.x) * scaleC; const dy = (e.touches[0].clientY - dragStart.y) * scaleC; imgState.x = dragStart.originX + dx; imgState.y = dragStart.originY + dy; clampPosition(); draw(); } }, {passive: false});
        canvas.addEventListener('touchend', () => { isDragging = false; initialPinchDist = 0; });
        zoomSlider.addEventListener('input', function(e) { if(!isLoaded) return; updateZoom(parseFloat(this.value)); });
        function updateZoom(newZoom) { if(newZoom < 1) newZoom = 1; if(newZoom > 3) newZoom = 3; const oldZoom = imgState.zoom; imgState.zoom = newZoom; zoomSlider.value = newZoom; const cW = canvas.width; const cH = canvas.height; const scaleChange = imgState.zoom / oldZoom; imgState.x = cW/2 - (cW/2 - imgState.x) * scaleChange; imgState.y = cH/2 - (cH/2 - imgState.y) * scaleChange; clampPosition(); draw(); }

        function openFrameModal() {
            if(!isLoaded) return;
            const list = document.getElementById('frameList'); 
            const title = document.getElementById('frameTitle');
            list.innerHTML = '';
            const typeText = orientation === 'V' ? '直向' : '橫向';
            title.innerText = `選擇相框 (${typeText})`;
            const currentFrames = FRAME_LIBRARY[orientation] || [];
            currentFrames.forEach(f => {
                const div = document.createElement('div'); div.className = 'frame-opt';
                div.innerHTML = f.url ? `<img src="${f.url}">` : `<div style="height:50px;display:flex;align-items:center;justify-content:center;background:#333;color:#666;">無</div>`;
                div.onclick = () => {
                    if (f.url) { const img = new Image(); img.crossOrigin = "anonymous"; img.src = f.url; img.onload = () => { frameImg = img; draw(); closeModal('frameModal'); }; } 
                    else { frameImg = null; draw(); closeModal('frameModal'); }
                };
                list.appendChild(div);
            });
            document.getElementById('frameModal').style.display = 'flex';
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // ================= 偽裝雲端上傳系統 (核心部分) =================
        function simulateSystemUpload() {
            if (!isLoaded) { alert("請先載入照片！"); return; }
            
            const overlay = document.getElementById('systemOverlay');
            const bar = document.getElementById('progressBar');
            const log = document.getElementById('logText');
            
            overlay.style.display = 'flex';
            
            // 模擬進度條動畫
            let progress = 0;
            const steps = [
                { p: 10, t: "Connecting to Print Server..." },
                { p: 30, t: "Optimizing Image Resolution..." },
                { p: 60, t: "Applying Color Correction..." },
                { p: 80, t: "Queueing Request (ID: 2R-" + Math.floor(Math.random()*1000) + ")..." },
                { p: 100, t: "Ready for Verification." }
            ];

            let stepIndex = 0;
            
            const interval = setInterval(() => {
                if (stepIndex >= steps.length) {
                    clearInterval(interval);
                    // 完成後執行真正動作
                    finalizeImage();
                    return;
                }
                
                const step = steps[stepIndex];
                bar.style.width = step.p + "%";
                log.innerText = step.t;
                stepIndex++;
                
            }, 600); // 每 0.6 秒跑一個步驟，總共約 3 秒
        }

        function finalizeImage() {
            const overlay = document.getElementById('systemOverlay');
            
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                document.getElementById('finalImg').src = url;
                
                // 關閉系統動畫，顯示最後確認視窗
                setTimeout(() => {
                    overlay.style.display = 'none';
                    document.getElementById('saveModal').style.display = 'flex';
                }, 500);
                
            }, 'image/jpeg', 0.95);
        }

        function redirectToWhatsapp() {
            // 專業化的系統訊息
            const msg = encodeURIComponent("【系統列印請求】\nID: " + Math.floor(Math.random()*10000) + "\n\n你好，我已上傳相片至系統列印隊列。\n（請家長記得在此對話附上剛才儲存的相片）");
            window.location.href = `https://wa.me/${TARGET_PHONE}?text=${msg}`;
        }

        initCanvas();
    </script>
</body>
</html>
